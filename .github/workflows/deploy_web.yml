# Publishes the web build to GitHub Pages.
#
# Prerequisite, done once by hand: Settings -> Pages -> Source must be set to
# "GitHub Actions". The default GITHUB_TOKEN cannot create the Pages site
# itself -- actions/configure-pages with enablement: true fails with
# "Resource not accessible by integration" -- so there is no point trying.
name: Deploy web app

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it, but only keep one
# queued behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # Pages serves this repository at /Project/, so the base href has to
      # match or every asset request 404s.
      - name: Build web app
        run: flutter build web --release --base-href /Project/

      # Without this, Pages runs the output through Jekyll, which drops any
      # file or directory whose name starts with an underscore.
      - name: Disable Jekyll processing
        run: touch build/web/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
