name: Build release APK and Play bundle

on:
  push:
    branches:
      - main
  # Lets a build be re-run from the Actions tab without a code change --
  # useful right after changing the signing secrets.
  workflow_dispatch:

# Creating the release needs write access to the repository's contents;
# the default token is read-only for everything not listed here.
permissions:
  contents: write

jobs:
  build:
    name: Build APK and bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Set up release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 is not set - the APK gets a throwaway debug key and will not install over a previous build."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=upload
          keyPassword=$KEYSTORE_PASSWORD
          EOF
          echo "Release keystore installed."

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # SCAN_ENDPOINT: see the note in deploy_web.yml and worker/README.md.
      #
      # --build-number sets the version code. Play refuses any upload whose
      # code is not higher than every code accepted before, and the run
      # number is the one figure that always rises. The APK gets the same
      # one so a phone can tell the two apart the same way Play does.
      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define=SCAN_ENDPOINT="${SCAN_ENDPOINT}"
        env:
          SCAN_ENDPOINT: ${{ vars.SCAN_ENDPOINT }}

      # What Google Play takes. One bundle carries every architecture and
      # screen density; Play builds each phone its own APK out of it, which
      # is why the download is roughly a third of the universal APK above.
      - name: Build Play bundle
        run: |
          flutter build appbundle --release \
            --build-number=${{ github.run_number }} \
            --dart-define=SCAN_ENDPOINT="${SCAN_ENDPOINT}"
        env:
          SCAN_ENDPOINT: ${{ vars.SCAN_ENDPOINT }}

      - name: Report sizes
        run: |
          ls -lh build/app/outputs/flutter-apk/app-release.apk \
                 build/app/outputs/bundle/release/app-release.aab

      # Printed so the signing certificate can be compared between runs: if
      # this digest ever changes, updates will stop installing over the
      # previous version.
      - name: Report signing certificate
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          apksigner=$(find "$sdk" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "apksigner not found; skipping."
            exit 0
          fi
          "$apksigner" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk \
            | grep -i 'SHA-256 digest' || true

      # Kept alongside the release: an artifact is the only thing produced
      # by a manual re-run that is not meant to become a version.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload Play bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # A release, unlike an artifact, never expires and needs no GitHub
      # account to download -- this repository is public, so the asset URL
      # is simply a file on the web. The asset is named without the version
      # on purpose: that makes
      #   .../releases/latest/download/Solidus.apk
      # a permanent link to whatever the newest build is, which is the one
      # worth bookmarking or sending to someone.
      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          tag="v${version}-${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk Solidus.apk
          cp build/app/outputs/bundle/release/app-release.aab Solidus.aab

          # Written to a file rather than passed inline, so the notes keep
          # their own indentation instead of this block's.
          {
            git log -1 --pretty=%s
            echo
            echo "Скачайте Solidus.apk и откройте его на телефоне. Ставится поверх предыдущей версии, данные сохраняются."
            echo
            echo "Постоянная ссылка на последнюю версию:"
            echo "https://github.com/${{ github.repository }}/releases/latest/download/Solidus.apk"
            echo
            echo "Solidus.aab — сборка для Google Play, код версии ${{ github.run_number }}."
          } > release-notes.md

          gh release create "$tag" Solidus.apk Solidus.aab \
            --title "Solidus $version — сборка ${{ github.run_number }}" \
            --notes-file release-notes.md \
            --latest
